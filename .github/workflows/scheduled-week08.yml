name: Release approved Luke week 8
on:
  schedule:
    # 06:00 UTC = 07:00 in Paris. In-app timed reading is already deployed.
    - cron: '0,17,37,53 6-23 30 11 *'
    - cron: '13 0-12 1 12 *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Rehearse safely without publishing scheduled teaching'
        type: boolean
        default: true
        required: true
permissions:
  contents: write
  pages: write
concurrency:
  group: approved-week08-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Validate and publish approved package when due
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DGROUPS_WEEK08_KEY: ${{ secrets.DGROUPS_WEEK08_KEY }}
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only && 'true' || 'false' }}
        run: node .github/scripts/cloud-week08.mjs
